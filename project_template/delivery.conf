# 納品先設定 — pre-pushフックと sync_to_delivery.sh が参照する（git_safety.md 4章）
# 値が未設定の間、pre-pushフックのガードは無効（何もブロックしない）

# クライアントリポジトリのホスト名。このホスト宛のpushをフックが検査する
CLIENT_HOST=

# 4.1の禁止パス（grep -E 形式）。プロジェクト固有の追加禁止パスはここに足す
BANNED_PATTERN=^\.agent/|^\.claude/|^\.antigravity|^\.clinerules|^CLAUDE\.md$|^MEMORY\.md$|^task/|TASK_LOG
